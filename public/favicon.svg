<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -2 70 104" width="70" height="104" role="img" aria-label="Postscript logo">
  <!-- The Postscript logo (家書 chop). Same drawing as src/components/ui/LogoStamp.tsx. -->
  <defs>
    <filter id="press" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="11" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="ink" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="5" result="n" />
      <feColorMatrix in="n" values="0 0 0 0 0.96  0 0 0 0 0.94  0 0 0 0 0.89  0 0 0 -2.6 1.45" result="speckle" />
      <feComposite in="speckle" in2="SourceGraphic" operator="in" />
    </filter>
  </defs>
  <g transform="rotate(-3 31 50)">
    <g filter="url(#press)">
      <rect x="3" y="3" width="56" height="94" rx="3" fill="#c8492f" />
      <rect x="7.5" y="7.5" width="47" height="85" rx="1.5" fill="none" stroke="#f5efe3" stroke-width="1.6" />
      <g fill="#f5efe3" font-family="'Noto Serif TC', 'Songti TC', 'PMingLiU', serif" font-weight="700" font-size="34" text-anchor="middle">
        <text x="31" y="45">家</text>
        <text x="31" y="83">書</text>
      </g>
    </g>
    <rect x="3" y="3" width="56" height="94" rx="3" fill="#c8492f" filter="url(#ink)" opacity="0.32" />
  </g>
</svg>
